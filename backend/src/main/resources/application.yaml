spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/omnicash_test
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

api:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  recovery:
    email-api-key: ${RESEND_API_KEY:}
    from: ${RECOVERY_EMAIL_FROM:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${API_CORS_ALLOWED_ORIGINS:https://omnicash.netlify.app,http://localhost:5173}
  security:
    token:
      secret: ${API_SECURITY_TOKEN_SECRET:${random.uuid}${random.uuid}}
